shr_parameters:
  pddl:
    instances:
      Persons: {
        type: string_array,
        default_value: [ "nathan" ],
        description: "all people in protocols",
      }
    OneReminderProtocol:
      instances: {
        type: string_array,
        default_value: [ "med_r1" ,"med_r2","med_r3","med_r4", "food_r1", "food_r2", "food_r3","food_r4" ],
        description: "one_reminder protocols",
      }
      one_reminder_times: {
        type: string_array,
        default_value: ["Everyday 07h00m0s/08h00m0s" , "Everyday 10h00m0s/11h00m0s", "Everyday 13h00m0s/14h00m0s","Everyday 17h00m0s/17h50m0s",
        "Everyday 09h00m0s/09h50m0s","Everyday 12h00m0s/12h55m0s","Everyday 16h00m0s/16h50m0s","Everyday 19h00m0s/19h50m0s"],
        description: "time that each protocol is triggered",
      }
    
  topics:
    time: {
      type: string,
      default_value: "/protocol_time",
      description: "topic for protocol clock time",
    }
    person_location: {
      type: string,
      default_value: "/person_location",
      description: "topic for protocol clock time",
    }
    person_taking_medicine: {
      type: string,
      default_value: "/person_taking_medicine",
      description: "topic for sensor that detect if medication is taken",
    }
    person_shower: {
      type: string,
      default_value: "/person_shower",
      description: "topic for sensor that detect if patients is taking shower or not",
    }
    person_eating: {
      type: string,
      default_value: "/person_eating",
      description: "topic for sensor that detect if patient is eating",
    }
    robot_charging: {
      type: string,
      default_value: "/charging",
      description: "topic for smart plug that detect if robot is charging",
    }

    good_weather: {
      type: string,
      default_value: "/good_weather",
      description: "topic for checking good weather",
    }

    pam_outside: {
      type: string,
      default_value: "/pam_outside",
      description: "topic for checking good weather",
    }

    display_ack: {
      type: string,
      default_value: "/display_rx",
      description: "topic for display ack",
    }

    time_for_drinking: {
      type: string,
      default_value: "/time_for_drinking",
      description: "topic for display ack",
    }

  person_tf: {
    type: string,
    default_value: "nathan",
    description: "person tf frame id",
  }
  robot_tf: {
    type: string,
    default_value: "base_link",
    description: "robot tf frame id",
  }
  
